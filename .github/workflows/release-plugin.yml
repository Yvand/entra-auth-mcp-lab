name: Release Entra MCP Identity Lab - Cowork

on:
  push:
    tags:
      - releases/cowork-plugin/v*

permissions:
  contents: read

concurrency:
  group: release-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/cowork-plugin/package-lock.json
      - name: Install packaging dependencies
        working-directory: clients/cowork-plugin
        run: npm ci --ignore-scripts
      - name: Validate the complete release tag
        id: version
        working-directory: clients/cowork-plugin
        env:
          PLUGIN_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(node --input-type=module -e 'import { versionFromTag } from "./scripts/package.mjs"; console.log(versionFromTag(process.env.PLUGIN_TAG));')
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test packaging
        working-directory: clients/cowork-plugin
        run: npm test
      - name: Build configuration template
        working-directory: clients/cowork-plugin
        env:
          PLUGIN_TAG: ${{ github.ref_name }}
        run: npm run package -- --tag "$PLUGIN_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: entra-mcp-identity-lab-cowork-template
          path: clients/cowork-plugin/build/entra-mcp-identity-lab-cowork-plugin-template-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: entra-mcp-identity-lab-cowork-template
          path: release
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_TAG: ${{ github.ref_name }}
          PLUGIN_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_NOTES: |
            Entra MCP Identity Lab for Microsoft 365 Copilot Cowork: configuration template.

            This ZIP is NOT install-ready. Replace the MCP HTTPS endpoint, OAuthPluginVault
            registration reference, and developer/privacy/terms placeholders in manifest.json,
            then repackage and install into an eligible tenant.

            Setup: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/clients/cowork-plugin/README.md

            One skill calls both whoami and echo on the Entra-protected MCP server.
            No credentials are included. This release does not deploy Azure resources,
            install tenant apps, or publish to the Microsoft 365 store.
        run: |
          if gh release view "$PLUGIN_TAG" >/dev/null 2>&1; then
            printf 'A release already exists for %s\n' "$PLUGIN_TAG" >&2
            exit 1
          fi
          gh release create "$PLUGIN_TAG" \
            "release/entra-mcp-identity-lab-cowork-plugin-template-${PLUGIN_VERSION}.zip" \
            --draft \
            --verify-tag \
            --title "Entra MCP Identity Lab - Cowork ${PLUGIN_VERSION} (configuration template)" \
            --notes "$RELEASE_NOTES"
